<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products – ElectroHub</title>
    <link rel="stylesheet" href="CSS/shared.css" />
    <link rel="stylesheet" href="CSS/products.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- NAVBAR -->
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <div class="navbar-left">
        <div class="logo">Electro<span>Hub</span></div>
        <ul class="nav-links" role="list">
          <li><a href="home.html">Home</a></li>
          <li>
            <a href="products.html" class="active" aria-current="page"
              >Products</a
            >
          </li>
          <li><a href="cart.html">Cart</a></li>
          <li class="auth-nav-link"><a href="login.html">Login</a></li>
        </ul>
      </div>
      <div class="navbar-right">
        <button class="search-toggle-btn" aria-label="Search products">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          Search
        </button>
        <a href="cart.html" class="cart-btn" aria-label="View cart">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 01-8 0" />
          </svg>
          Cart <span class="cart-count">0</span>
        </a>
        <button class="hamburger" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <!-- SEARCH OVERLAY -->
    <div id="search-overlay" class="search-overlay" role="search">
      <div class="search-box">
        <div class="search-input-row">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Search products…"
            autocomplete="off"
            aria-label="Search products"
          />
          <button
            id="search-close"
            class="search-close-btn"
            aria-label="Close search"
          >
            ✕
          </button>
        </div>
        <div id="search-results" class="search-results" role="listbox"></div>
      </div>
    </div>

    <!-- PAGE HEADER -->
    <header class="page-header" aria-labelledby="page-title">
      <div class="page-header-inner">
        <div>
          <h1 id="page-title">All Products</h1>
          <p id="products-count" aria-live="polite">Showing all products</p>
        </div>
      </div>
    </header>

    <!-- CONTROLS -->
    <div
      class="controls-bar"
      role="region"
      aria-label="Filter and sort controls"
    >
      <div class="filters-row">
        <div class="filter-group" role="group" aria-label="Category filter">
          <button
            class="filter-btn active"
            data-category="all"
            onclick="applyFilter('all', this)"
          >
            All
          </button>
          <button
            class="filter-btn"
            data-category="Laptops"
            onclick="applyFilter('Laptops', this)"
          >
            Laptops
          </button>
          <button
            class="filter-btn"
            data-category="Smartphones"
            onclick="applyFilter('Smartphones', this)"
          >
            Smartphones
          </button>
          <button
            class="filter-btn"
            data-category="Audio"
            onclick="applyFilter('Audio', this)"
          >
            Audio
          </button>
          <button
            class="filter-btn"
            data-category="Wearables"
            onclick="applyFilter('Wearables', this)"
          >
            Wearables
          </button>
          <button
            class="filter-btn"
            data-category="Cameras"
            onclick="applyFilter('Cameras', this)"
          >
            Cameras
          </button>
          <button
            class="filter-btn"
            data-category="Accessories"
            onclick="applyFilter('Accessories', this)"
          >
            Accessories
          </button>
        </div>

        <div class="sort-group">
          <label for="sort-select" class="sort-label">Sort by:</label>
          <select
            id="sort-select"
            onchange="applySort(this.value)"
            aria-label="Sort products"
          >
            <option value="default">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="title-asc">Name A–Z</option>
          </select>
        </div>
      </div>
    </div>

    <!-- PRODUCT GRID -->
    <main class="products-main" id="main-content">
      <div
        class="product-grid"
        id="products-grid"
        role="list"
        aria-label="Product listings"
      >
        <!-- Injected by JS -->
      </div>
    </main>

    <!-- FOOTER -->
    <footer role="contentinfo">
      <div class="footer-logo">Electro<span>Hub</span></div>
      <p>© 2026 ElectroHub – All rights reserved</p>
    </footer>

    <script src="JS/shared.js"></script>
    <script src="JS/products.js"></script>
  </body>
</html>
