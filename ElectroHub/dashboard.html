<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard – ElectroHub</title>
    <link rel="stylesheet" href="CSS/shared.css" />
    <link rel="stylesheet" href="CSS/dashboard.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar" role="navigation">
      <div class="navbar-left">
        <div class="logo">Electro<span>Hub</span></div>
        <ul class="nav-links" role="list">
          <li><a href="home.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li class="auth-nav-link"><a href="login.html">Login</a></li>
        </ul>
      </div>
      <div class="navbar-right">
        <button class="search-toggle-btn">Search</button>
        <a href="cart.html" class="cart-btn">Cart <span class="cart-count">0</span></a>
        <button class="hamburger"><span></span><span></span><span></span></button>
      </div>
    </nav>

    <!-- SEARCH OVERLAY -->
    <div id="search-overlay" class="search-overlay" role="search" aria-label="Product search">
      <div class="search-box">
        <div class="search-input-row">
          <input type="text" id="search-input" placeholder="Search..." autocomplete="off" />
          <button id="search-close" class="search-close-btn">✕</button>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>
    </div>

    <!-- MAIN -->
    <main class="dashboard-page" id="main-content">
      <div class="dashboard-header">
        <h1>Admin Dashboard</h1>
        <p id="admin-name" style="color:var(--text-muted)"></p>
      </div>

      <div class="dashboard-nav">
        <button class="active" data-target="orders-sec">Orders</button>
        <button data-target="products-sec">Products</button>
        <button data-target="users-sec">Users</button>
      </div>

      <!-- ORDERS -->
      <section id="orders-sec" class="dashboard-section active">
        <h2>Manage Orders</h2>
        <table id="admin-orders-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>User</th>
              <th>Total</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- PRODUCTS -->
      <section id="products-sec" class="dashboard-section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2>Manage Products</h2>
          <button class="add-btn" onclick="displayModal()">Add Product</button>
        </div>
        <table id="admin-products-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Title</th>
              <th>Category</th>
              <th>Price</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
      

      <!-- USERS -->
      <section id="users-sec" class="dashboard-section">
        <h2>Manage Users</h2>
        <table id="admin-users-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

    </main>
    <div id="add-product-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="hideModal()">&times;</span>
        <h2>Add Product</h2>
        <form id="add-product-form" onsubmit="addProduct(event)">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required>

          <label for="description">Description</label>
          <textarea id="description" name="description" required></textarea>

          <label for="price">Price</label>
          <input type="number" id="price" name="price" required>
          <label for="specs">specs</label>
          <input type="text" id="specs" name="specs" required>

          <label for="image">Image</label>
          <input type="file" id="image" name="image" required>

          <button type="submit">Add Product</button>
        </form>
      </div>
    </div>

    <script src="JS/shared.js"></script>
    <script src="JS/dashboard.js"></script>
  </body>
</html>
