<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register – ElectroHub</title>
    <link rel="stylesheet" href="CSS/shared.css" />
    <link rel="stylesheet" href="CSS/auth.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- NAVBAR -->
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <div class="navbar-left">
        <div class="logo">Electro<span>Hub</span></div>
        <ul class="nav-links" role="list">
          <li><a href="home.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li class="auth-nav-link"><a href="login.html">Login</a></li>
        </ul>
      </div>
      <div class="navbar-right">
        <button class="search-toggle-btn" aria-label="Search products" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          Search
        </button>
        <a href="cart.html" class="cart-btn" aria-label="View cart">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 01-8 0" />
          </svg>
          Cart <span class="cart-count">0</span>
        </a>
        <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <!-- SEARCH OVERLAY -->
    <div id="search-overlay" class="search-overlay" role="search" aria-label="Product search">
      <div class="search-box">
        <div class="search-input-row">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input type="text" id="search-input" placeholder="Search by product name or category…" autocomplete="off" aria-label="Search products" />
          <button id="search-close" class="search-close-btn" aria-label="Close search">✕</button>
        </div>
        <div id="search-results" class="search-results" role="listbox" aria-label="Search results"></div>
      </div>
    </div>

    <!-- MAIN -->
    <main class="auth-page" id="main-content">
      <div class="auth-container">
        <h1>Create an Account</h1>
        <p>Join ElectroHub today</p>
        <div id="error-message" class="error-message"></div>
        <form id="register-form" class="auth-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="password">Password (min 6 characters)</label>
            <input type="password" id="password" required autocomplete="new-password" minlength="6" />
          </div>
          <button type="submit" class="btn-primary">Sign Up</button>
        </form>
        <div class="auth-links">
          Already have an account? <a href="login.html">Log In</a>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer role="contentinfo">
      <div class="footer-logo">Electro<span>Hub</span></div>
      <p>© 2026 ElectroHub – All rights reserved</p>
    </footer>

    <script src="JS/shared.js"></script>
    <script src="JS/auth.js"></script>
  </body>
</html>
