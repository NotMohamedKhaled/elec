<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details – ElectroHub</title>
    <link rel="stylesheet" href="CSS/shared.css" />
    <link rel="stylesheet" href="CSS/product-detail.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- NAVBAR -->
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <div class="navbar-left">
        <div class="logo">Electro<span>Hub</span></div>
        <ul class="nav-links" role="list">
          <li><a href="home.html">Home</a></li>
          <li><a href="products.html" class="active">Products</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li class="auth-nav-link"><a href="login.html">Login</a></li>
        </ul>
      </div>
      <div class="navbar-right">
        <button class="search-toggle-btn" aria-label="Search products">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          Search
        </button>
        <a href="cart.html" class="cart-btn" aria-label="View cart">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 01-8 0" />
          </svg>
          Cart <span class="cart-count">0</span>
        </a>
        <button class="hamburger" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <!-- SEARCH OVERLAY -->
    <div id="search-overlay" class="search-overlay" role="search">
      <div class="search-box">
        <div class="search-input-row">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Search products…"
            autocomplete="off"
            aria-label="Search products"
          />
          <button
            id="search-close"
            class="search-close-btn"
            aria-label="Close search"
          >
            ✕
          </button>
        </div>
        <div id="search-results" class="search-results" role="listbox"></div>
      </div>
    </div>

    <!-- BREADCRUMB -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="home.html">Home</a>
      <span aria-hidden="true">›</span>
      <a href="products.html">Products</a>
      <span aria-hidden="true">›</span>
      <span id="breadcrumb-title">Product Details</span>
    </nav>

    <!-- DETAIL HERO -->
    <main id="main-content" aria-labelledby="product-title">
      <!-- BACKDROP -->
      <div
        class="detail-backdrop"
        id="detail-backdrop"
        aria-hidden="true"
      ></div>

      <div class="detail-layout">
        <!-- POSTER -->
        <div class="detail-poster-wrap">
          <img
            id="detail-poster"
            src=""
            alt=""
            class="detail-poster"
            loading="eager"
          />
          <div class="detail-category-badge" id="detail-category"></div>
        </div>

        <!-- INFO -->
        <div class="detail-info">
          <h1 class="detail-title" id="product-title"></h1>

          <div class="detail-meta-row">
            <span class="meta-chip" id="detail-category-chip"></span>
            <span class="meta-chip">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polygon
                  points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                />
              </svg>
              <span id="detail-rating">4.7 / 5</span>
            </span>
          </div>

          <p class="detail-description" id="detail-description"></p>

          <!-- SPECIFICATIONS -->
          <div class="detail-section">
            <h3>Specifications</h3>
            <ul class="specs-list" id="detail-specs"></ul>
          </div>

          <!-- QUANTITY -->
          <div class="detail-section">
            <h3>Quantity</h3>
            <div class="qty-row">
              <div class="qty-counter" role="group" aria-label="Quantity">
                <button
                  class="qty-btn"
                  id="qty-minus"
                  onclick="changeQty(-1)"
                  aria-label="Decrease"
                >
                  −
                </button>
                <span class="qty-count" id="qty-count" aria-live="polite"
                  >1</span
                >
                <button
                  class="qty-btn"
                  id="qty-plus"
                  onclick="changeQty(1)"
                  aria-label="Increase"
                >
                  +
                </button>
              </div>
              <div class="price-summary">
                <span class="price-per"
                  >$<span id="price-per">0</span> per unit</span
                >
                <span class="price-total"
                  >Total: <strong id="price-total">$0</strong></span
                >
              </div>
            </div>
          </div>

          <!-- CTA -->
          <div class="detail-cta">
            <button
              class="add-to-cart-btn"
              id="add-to-cart-btn"
              onclick="addToCartFromDetail()"
              aria-label="Add to cart"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
                <line x1="3" y1="6" x2="21" y2="6" />
                <path d="M16 10a4 4 0 01-8 0" />
              </svg>
              Add to Cart
            </button>
            <a href="products.html" class="btn-secondary">← Back to Products</a>
          </div>
        </div>
      </div>

      <!-- RELATED PRODUCTS -->
      <section class="related-section" aria-labelledby="related-title">
        <h2 id="related-title">You may also like</h2>
        <div class="product-grid" id="related-grid" role="list"></div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer role="contentinfo">
      <div class="footer-logo">Electro<span>Hub</span></div>
      <p>© 2026 ElectroHub – All rights reserved</p>
    </footer>

    <script src="JS/shared.js"></script>
    <script src="JS/product-detail.js"></script>
  </body>
</html>
